<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Coffee Shop</title>
</head>
<body>
    <header>
        <h1>Welcome to Our Coffee Shop</h1>
        <nav>
            <ul>
                <li><a href="#hero">Home</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="hero">
            <h2>Freshly Brewed Coffee</h2>
            <p>Experience the best coffee in town.</p>
            <img src="https://images.unsplash.com/photo-1502462041640-b3d7e50d0662?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8ODl8fGNvZmZlZXxlbnwwfHwwfHx8MA%3D%3D" alt="Coffee">
        </section>
        <section id="menu">
            <h2>Drinks</h2>
            <ul>
                <li><img src="https://media.istockphoto.com/id/860396214/photo/top-view-of-coffee-caff%C3%A8-mocha-also-know-as-mocaccino.webp?a=1&b=1&s=612x612&w=0&k=20&c=nJZxbNt1qLjZoVVJKsl7EawwLrDaxWl6hOmjNbd08Wg=" alt="Cappuccino"><strong>Caffè mocha</strong> - $3.70</li>
                <li><img src="https://media.istockphoto.com/id/1139917368/photo/making-pictures.webp?a=1&b=1&s=612x612&w=0&k=20&c=QcNT3Y_xBwVzC_uXokMk5492X0TwCFNy4kEzThWwx_o=" alt="Latte"><strong>Latte</strong> - $4.00</li>
                <li><img src="https://media.istockphoto.com/id/1434203329/photo/barista-holding-a-cup-of-espresso-coffee.webp?a=1&b=1&s=612x612&w=0&k=20&c=xeRW8AZxHwFFv-DOA4MEbL4vuEpLLsglLy-44VGolfM=" alt="Cappuccino"><strong>Cappuccino</strong> - $4.50</li>
                <li><img src="https://media.istockphoto.com/id/184876747/photo/espresso-shot-with-crema.webp?a=1&b=1&s=612x612&w=0&k=20&c=fPrZLFAQMxsgl_5vt7nLI8oLoXqmpaLzxhEn83lgITE=" alt="Cappuccino"><strong>Doppio</strong> - $5.00</li>
                <li><img src="https://images.unsplash.com/photo-1550948309-0d8983dbdcc3?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8S29waSUyMEx1d2FrfGVufDB8fDB8fHww" alt="Cappuccino"><strong>Kopi Luwak</strong> - $5.50</li>
            </ul>
        </section>
        <section id="contact">
            <h2>Get in Touch</h2>
            <form id="contactForm">
                <div>
                    <label for="name">Name:</label>
                    <input type="text" id="name" required>
                    
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                </div>
                <div>
                    <label for="message">Message:</label>
                    <textarea id="message" required></textarea>    
                </div>
                <button type="submit">Send</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; All Rights Reserved ❤️ Maaz Niazi.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
